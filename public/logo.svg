<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="cubeTop" x1="12" y1="8" x2="36" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#168BFF" />
      <stop offset="100%" stop-color="#8057E8" />
    </linearGradient>
    <linearGradient id="cubeLeft" x1="12" y1="20" x2="24" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#007ACC" />
      <stop offset="100%" stop-color="#0D1521" />
    </linearGradient>
    <linearGradient id="cubeRight" x1="24" y1="20" x2="36" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#168BFF" />
      <stop offset="100%" stop-color="#152235" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer ambient glow -->
  <polygon points="24,6 40,15 24,24 8,15" fill="#168BFF" opacity="0.25" filter="url(#glow)"/>

  <!-- Top isometric face -->
  <polygon points="24,8 39,16.5 24,25 9,16.5" fill="url(#cubeTop)" stroke="#26364A" stroke-width="1"/>

  <!-- Left isometric face -->
  <polygon points="9,16.5 24,25 24,40 9,31.5" fill="url(#cubeLeft)" stroke="#26364A" stroke-width="1"/>

  <!-- Right isometric face -->
  <polygon points="24,25 39,16.5 39,31.5 24,40" fill="url(#cubeRight)" stroke="#26364A" stroke-width="1"/>

  <!-- Internal code brackets / node connector overlay -->
  <path d="M19 14 L15 16.5 L19 19" stroke="#F4F7FB" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M29 14 L33 16.5 L29 19" stroke="#F4F7FB" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="24" cy="16.5" r="1.75" fill="#3CCB83"/>
</svg>
